<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="481.5" height="278.43763" viewBox="0,0,481.5,278.43763"><g transform="translate(0.75,-36.87405)"><g stroke-miterlimit="10"><path d="M0,314.56168v-276.93763h480v276.93763z" fill-opacity="0.53333" fill="#bc40ff" stroke="#4800a0" stroke-width="1.5"/><text transform="translate(220,64.34626) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">鸣谢</tspan></text><text transform="translate(55.1114,80.29432) scale(0.19669,0.19669)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">本游戏开发成果不是作者一个人的功劳，对于直接或间接帮助游戏开发的人或工具游戏作者在此表达感谢。</tspan></text><text transform="translate(24.19632,113.66558) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">游戏作者：[bilibili] song_luck</tspan></text><text transform="translate(24.39723,125.74158) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">制作工具：TurboWarp &amp;</tspan><tspan x="0" dy="48px">TurboWarp Packager</tspan></text><text transform="translate(24.39723,147.89073) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">游戏配乐（依照音频名字表示）：</tspan><tspan x="0" dy="48px">music:start1 - song_luck</tspan><tspan x="0" dy="48px">music:start2 - song_luck</tspan><tspan x="0" dy="48px">music:start3 - song_luck</tspan><tspan x="0" dy="48px">music:start4 - song_luck</tspan><tspan x="0" dy="48px">music:wait1 - Shostakovich Waltz No.2</tspan><tspan x="0" dy="48px">music:wait2 - song_luck</tspan><tspan x="0" dy="48px">music:wait3 - song_luck</tspan><tspan x="0" dy="48px">music:all1 - float3701</tspan><tspan x="0" dy="48px">music:special1 - song_luck</tspan></text><text transform="translate(24.39723,260.40674) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">辅助工具：VSCode,FL Studio 20,</tspan><tspan x="0" dy="48px">Toptal JavaScript Minifier,node.js</tspan></text><text transform="translate(281.34746,115.54248) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">使用TW扩展：Math,JSON,Time,</tspan><tspan x="0" dy="48px">Temporary Variables,Local Storage,</tspan><tspan x="0" dy="48px"> Peb,LZ Compress,Mobile Keyboard,</tspan><tspan x="0" dy="48px">Animated Text,clipboard,Files,</tspan><tspan x="0" dy="48px">numberEncoding V2</tspan></text><text transform="translate(281.34746,171.85602) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">使用自定义扩展：</tspan><tspan x="0" dy="48px">WebRTC - song_luck</tspan><tspan x="0" dy="48px">CryptoSuite - song_luck</tspan></text><text transform="translate(281.34746,205.40319) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">联机信令服务器：</tspan><tspan x="0" dy="48px">wss://clouddata.turbowarp.org</tspan></text><text transform="translate(153.1092,301.25741) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">谨向所有为游戏做出贡献的人或工具致谢！</tspan></text><text transform="translate(281.34746,227.30354) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">游戏部分音效来源：</tspan><tspan x="0" dy="48px">TurboWarp内置音效库</tspan></text><text transform="translate(281.34746,251.85105) scale(0.22866,0.22866)" font-size="40" xml:space="preserve" fill="#ffffff" stroke="none" stroke-width="1" font-family="Sans Serif" font-weight="400" text-anchor="start"><tspan x="0" dy="0">使用默认STUN服务器:</tspan><tspan x="0" dy="48px">请看"网络配置"界面</tspan></text></g></g></svg><!--rotationCenter:240.75000000000003:143.12595-->